<svg xmlns="http://www.w3.org/2000/svg" width="560" height="90" viewBox="0 0 560 90" role="img" aria-label="At a glance specifications">
  <defs>
    <linearGradient id="specBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1f22"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <linearGradient id="specEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="specGlow" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#5865F2" stop-opacity=".2"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x=".75" y=".75" width="558.5" height="88.5" rx="16" fill="url(#specBg)"/>
  <rect x=".75" y=".75" width="558.5" height="88.5" rx="16" fill="url(#specGlow)"/>
  <rect x=".75" y=".75" width="558.5" height="88.5" rx="16" fill="none" stroke="url(#specEdge)" stroke-width="1.2"/>
  
  <!-- Column 1: Volume Range -->
  <g font-family='"Segoe UI",system-ui,-apple-system,sans-serif'>
    <rect x="36" y="16" width="28" height="2.5" rx="1.2" fill="#5865F2"/>
    <text x="50" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-.3">0–200%</text>
    <text x="50" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#949BA4" letter-spacing=".4">VOLUME</text>
  </g>
  
  <path d="M125 24V66" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>
  
  <!-- Column 2: Supported Hardware -->
  <g font-family='"Segoe UI",system-ui,-apple-system,sans-serif'>
    <rect x="180" y="16" width="28" height="2.5" rx="1.2" fill="#23A55A"/>
    <text x="194" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-.3">5 Decks</text>
    <text x="194" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#949BA4" letter-spacing=".4">HARDWARE</text>
  </g>
  
  <path d="M265 24V66" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>
  
  <!-- Column 3: Connection Type -->
  <g font-family='"Segoe UI",system-ui,-apple-system,sans-serif'>
    <rect x="325" y="16" width="28" height="2.5" rx="1.2" fill="#5865F2"/>
    <text x="339" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-.3">Local IPC</text>
    <text x="339" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#949BA4" letter-spacing=".4">NAMED PIPES</text>
  </g>
  
  <path d="M415 24V66" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>
  
  <!-- Column 4: Engine -->
  <g font-family='"Segoe UI",system-ui,-apple-system,sans-serif'>
    <rect x="474" y="16" width="28" height="2.5" rx="1.2" fill="#57F287"/>
    <text x="488" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-.3">Qt 6.8+</text>
    <text x="488" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#949BA4" letter-spacing=".4">C++20 ENGINE</text>
  </g>
